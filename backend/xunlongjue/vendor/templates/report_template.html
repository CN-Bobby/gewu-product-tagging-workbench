<!DOCTYPE html>
<html lang="zh-CN" data-report-contract="xlj-mature-v3.3.1" data-renderer-version="4">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>寻龙诀 · 选品挖掘报告 - {{CATEGORY}}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1d1d1f;padding:40px 20px}.container{max-width:1400px;margin:0 auto}
.header{text-align:center;margin-bottom:24px}.header h1{font-size:28px;font-weight:700}.header .sub{font-size:16px;color:#86868b;margin-top:6px}
.toggle-bar{display:flex;justify-content:center;margin:16px 0 24px}.toggle-track{position:relative;display:flex;background:#e0e0e0;border-radius:30px;padding:4px;width:400px}
.toggle-slider{position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:calc(100% - 8px);background:linear-gradient(135deg,#1976d2,#7c4dff);border-radius:26px;transition:left .4s cubic-bezier(0.4,0,0.2,1)}
.toggle-btn{flex:1;text-align:center;padding:10px 0;border:none;background:transparent;cursor:pointer;position:relative;z-index:1;font-size:14px;font-weight:600;color:rgba(255,255,255,.6);transition:color .3s}.toggle-btn.active{color:#fff}
.toggle-track.insight .toggle-slider{left:calc(50% + 2px)}.view-panel{display:none}.view-panel.active{display:block;animation:fi .35s ease-out}@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.stats{display:flex;gap:16px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}.stat-card{background:#fff;border-radius:12px;padding:18px 24px;min-width:160px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}.stat-card .num{font-size:28px;font-weight:700}.stat-card .label{font-size:13px;color:#86868b;margin-top:2px}.stat-card .sublabel{font-size:11px;color:#aaa}
.stat-blue .num{color:#378add}.stat-blue{background:#e6f1fb}.stat-green .num{color:#1d9e75}.stat-green{background:#e1f5ee}.stat-red .num{color:#e24b4a}.stat-red{background:#fcebeb}.stat-purple .num{color:#7f77dd}.stat-purple{background:#eeedfe}
.group-counter{text-align:center;font-size:14px;color:#86868b;margin-bottom:16px;padding:8px;background:#fff;border-radius:8px}
.section{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}.section h2{font-size:18px;font-weight:600;margin-bottom:14px}.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}th{padding:10px 8px;text-align:left;color:#86868b;font-weight:500;font-size:12px;border-bottom:1px solid #e8e8ed;cursor:pointer;user-select:none;white-space:nowrap}th:hover{color:#378add}
th.sorted-asc .sort-arrow::after{content:' ▲';color:#378add}th.sorted-desc .sort-arrow::after{content:' ▼';color:#378add}
td{padding:8px;border-bottom:1px solid #f0f0f2;vertical-align:middle}td.num{text-align:right;font-variant-numeric:tabular-nums}tr:hover{background:#f8f8fa}
.node-link{color:#378add;text-decoration:none}.node-link:hover{text-decoration:underline}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}.badge-reg,.badge-green{background:#e1f5ee;color:#1d9e75}.badge-blue{background:#e6f1fb;color:#185fa5}.badge-warning{background:#faeeda;color:#854f0b}.badge-opp{background:#e1f5ee;color:#1d9e75}.badge-potential{background:#faeeda;color:#854f0b}.badge-eliminated{background:#fcebeb;color:#e24b4a}.badge-drill{background:#e6f1fb;color:#378add}
.partial-banner{margin:0 0 16px;padding:12px 16px;border:1px solid #fac775;border-radius:8px;background:#fff8e8;color:#854f0b;font-size:13px;font-weight:600}
.badge-l2{display:inline-block;background:#e6f1fb;color:#378add;padding:1px 6px;border-radius:3px;font-size:11px}.badge-l3{display:inline-block;background:#eeedfe;color:#7f77dd;padding:1px 6px;border-radius:3px;font-size:11px}.badge-l4{display:inline-block;background:#faeeda;color:#854f0b;padding:1px 6px;border-radius:3px;font-size:11px}
.star-btn{border:none;background:none;cursor:pointer;font-size:16px;opacity:.3;transition:.2s}.star-btn.starred{opacity:1;color:#ffb300}
.note-icon{cursor:pointer;opacity:.3;font-size:13px;margin-left:4px}.note-icon.has-note{opacity:1}
.collapse{margin-bottom:8px}.collapse-header{padding:10px 14px;background:#f5f5f7;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;user-select:none}.collapse-header:hover{background:#efeff1}.collapse-header .arrow{transition:transform .2s}.collapse.open .collapse-header .arrow{transform:rotate(90deg)}.collapse-body{display:none;padding:10px 0}.collapse.open .collapse-body{display:block}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.btn-action{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;background:#e6f1fb;color:#378add;transition:.2s}.btn-action:hover{background:#d0e5f7}.btn-action.active{background:#378add;color:#fff}
.search-box{padding:6px 12px;border:1px solid #d0d0d5;border-radius:6px;font-size:12px;outline:none;flex:1;min-width:120px}.search-box:focus{border-color:#378add}.count-display{font-size:12px;color:#86868b;margin-left:auto}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:1000}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:16px;padding:24px;width:400px;max-width:90vw;z-index:1001;box-shadow:0 8px 30px rgba(0,0,0,.15);display:none}.modal h3{font-size:16px;margin-bottom:4px}.modal .modal-path{font-size:12px;color:#86868b;margin-bottom:12px}.modal textarea{width:100%;height:100px;padding:8px;border:1px solid #d0d0d5;border-radius:8px;font-size:13px;resize:vertical}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.footer{margin-top:30px;padding:20px;background:#fff;border-radius:12px;font-size:12px;color:#86868b;line-height:1.8}.footer table{font-size:12px}.footer td{padding:4px 12px;border:none}
.m2-section{padding:0 4px}.m2-cards{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}.m2-card{background:#fff;border-radius:12px;padding:16px 20px;min-width:140px;flex:1;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}.m2-card-num{font-size:24px;font-weight:700}.m2-card-label{font-size:12px;color:#86868b;margin-top:2px}.m2-card-sub{font-size:11px;color:#aaa}
.m2-blue .m2-card-num{color:#378add}.m2-blue{background:#e6f1fb}.m2-green .m2-card-num{color:#1d9e75}.m2-green{background:#e1f5ee}.m2-red .m2-card-num{color:#e24b4a}.m2-red{background:#fcebeb}.m2-amber .m2-card-num{color:#854f0b}.m2-amber{background:#faeeda}
.m2-section h3{font-size:17px;font-weight:600;margin:24px 0 12px}.m2-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:16px}.m2-table th{padding:8px 10px;text-align:left;color:#86868b;font-weight:500;font-size:12px;border-bottom:1px solid #e8e8ed}.m2-table td{padding:8px 10px;border-bottom:1px solid #f0f0f2}
.s-high{font-size:12px;padding:2px 6px;border-radius:4px;color:#1d9e75;background:#e1f5ee}.s-med{font-size:12px;padding:2px 6px;border-radius:4px;color:#378add;background:#e6f1fb}
.m2-cluster-grid{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.m2-cluster-card{padding:14px 18px;border-radius:10px;min-width:160px;flex:1}.m2-green-card{background:#e8f5e9;border:1px solid #a5d6a7}.m2-cluster-title{font-weight:600;font-size:14px;margin-bottom:4px}.m2-cluster-stat{font-size:12px;color:#555}
.m2-migration{padding:14px;background:#f5f5f7;border-radius:8px;margin-bottom:16px}.m2-migration p{margin-bottom:8px;font-size:13px;line-height:1.6}
.m2-check{color:#1d9e75;font-weight:700}.m2-warn{color:#ffb300;font-weight:700}
.badge-p0{background:#e24b4a;color:#fff;padding:1px 6px;border-radius:3px;font-size:11px}.badge-p1{background:#ffb300;color:#fff;padding:1px 6px;border-radius:3px;font-size:11px}.badge-p2{background:#7f77dd;color:#fff;padding:1px 6px;border-radius:3px;font-size:11px}
.audit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:18px}.audit-item{background:#fff;border:1px solid #ececf0;border-radius:10px;padding:11px 13px}.audit-item dt{font-size:11px;color:#86868b;margin-bottom:3px}.audit-item dd{font-size:13px;font-weight:600;word-break:break-all}.candidate-note{font-size:12px;color:#854f0b;background:#fff8e8;border:1px solid #fac775;border-radius:8px;padding:10px 12px;margin:-4px 0 14px}.empty-state{padding:28px;text-align:center;color:#86868b;background:#fff;border-radius:10px}.state-chips{display:flex;gap:5px;flex-wrap:wrap}.state-chip{font-size:11px;background:#f0f1f3;border-radius:12px;padding:2px 7px}.insight-note{font-size:12px;color:#666;line-height:1.65;background:#fff8e8;border-left:3px solid #ffb300;padding:10px 12px;margin:12px 0}
@media(max-width:720px){body{padding:22px 10px}.toggle-track{width:100%}.stat-card{min-width:calc(50% - 8px)}.section{padding:14px}.header h1{font-size:23px}}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>寻龙诀 · 选品挖掘报告</h1><div class="sub">{{CATEGORY}} · {{SITE}} · {{DATE}} · Node {{INIT_NODE}}</div></div>
<div class="toggle-bar"><div class="toggle-track" id="tt"><div class="toggle-slider"></div><button class="toggle-btn active" onclick="switchView('node')">📊 节点数据趋势</button><button class="toggle-btn" onclick="switchView('insight')">🔬 扫描过程洞察</button></div></div>
<div class="view-panel active" id="viewNode">{{NODE_VIEW}}</div>
<div class="view-panel" id="viewInsight">{{M2_VIEW}}</div>
</div>
<div class="modal-overlay" id="mo" onclick="closeNote()"></div>
<div class="modal" id="nm"><h3 id="nt"></h3><div class="modal-path" id="np"></div><textarea id="nmt"></textarea><div class="modal-actions"><button class="btn-action" onclick="closeNote()">取消</button><button class="btn-action" onclick="saveNote()" style="background:#378add;color:#fff">保存</button></div></div>

<script>
/* ═══════════════════════════════════════════════════
   寻龙诀报告交互脚本 — 所有函数名固定，不可修改
   ═══════════════════════════════════════════════════ */
var STORAGE_KEY={{STORAGE_KEY_JSON}};
var DATA={s:{},n:{}};
function loadData(){try{var d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{"s":{},"n":{}}');if(d&&typeof d==='object'&&(d.s||d.n))return{s:d.s||{},n:d.n||{}};if(d&&typeof d==='object')return{s:d,n:{}};return{s:{},n:{}}}catch(err){return{s:{},n:{}}}}
function persistData(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(DATA));return true}catch(err){return false}}
function init(){DATA=loadData();document.querySelectorAll('.star-btn').forEach(function(b){if(DATA.s[b.getAttribute('data-nid')]){b.textContent='⭐';b.classList.add('starred');b.setAttribute('aria-pressed','true');b.closest('tr').classList.add('sr')}});document.querySelectorAll('.note-icon').forEach(function(b){if(DATA.n[b.getAttribute('data-nid')])b.classList.add('has-note')});updateCounts()}init();

function switchView(v){document.querySelectorAll('.toggle-btn').forEach(function(b,i){b.classList.toggle('active',(v==='node'&&i===0)||(v==='insight'&&i===1))});document.getElementById('tt').classList.toggle('insight',v==='insight');document.getElementById('viewNode').classList.toggle('active',v==='node');document.getElementById('viewInsight').classList.toggle('active',v==='insight')}

function toggleStar(n){var b=document.querySelectorAll('.star-btn[data-nid="'+n+'"]');if(DATA.s[n]){delete DATA.s[n];b.forEach(function(x){x.textContent='☆';x.classList.remove('starred');x.setAttribute('aria-pressed','false');x.closest('tr').classList.remove('sr')})}else{DATA.s[n]=true;b.forEach(function(x){x.textContent='⭐';x.classList.add('starred');x.setAttribute('aria-pressed','true');x.closest('tr').classList.add('sr')})}persistData();updateCounts()}

var _cnid='';
function openNote(nid,nm,p){_cnid=nid;document.getElementById('nt').textContent=nm;document.getElementById('np').textContent=p;document.getElementById('nmt').value=DATA.n[nid]||'';document.getElementById('mo').style.display='block';document.getElementById('nm').style.display='block'}
function closeNote(){document.getElementById('mo').style.display='none';document.getElementById('nm').style.display='none'}
function saveNote(){var t=document.getElementById('nmt').value.trim();if(t){DATA.n[_cnid]=t;document.querySelectorAll('.note-icon[data-nid="'+_cnid+'"]').forEach(function(b){b.classList.add('has-note')})}else{delete DATA.n[_cnid];document.querySelectorAll('.note-icon[data-nid="'+_cnid+'"]').forEach(function(b){b.classList.remove('has-note')})}persistData();updateCounts();closeNote()}

function updateCounts(){document.getElementById('cd').textContent='⭐'+(Object.keys(DATA.s||{}).length)+'·📝'+(Object.keys(DATA.n||{}).length)}

function filterStar(){document.getElementById('fsb').classList.toggle('active');applyFilters()}
function filterNote(){document.getElementById('fnb').classList.toggle('active');applyFilters()}
function showAll(){document.getElementById('fsb').classList.remove('active');document.getElementById('fnb').classList.remove('active');document.querySelector('.search-box').value='';applyFilters()}

function applyFilters(){var sf=document.getElementById('fsb').classList.contains('active');var nf=document.getElementById('fnb').classList.contains('active');var q=(document.querySelector('.search-box').value||'').toLowerCase().trim();document.querySelectorAll('tbody.filter-body').forEach(function(b){b.querySelectorAll('tr[data-id]').forEach(function(tr){var nid=tr.getAttribute('data-id');var s=true;if(sf&&!DATA.s[nid])s=false;if(nf&&!DATA.n[nid])s=false;if(q&&!tr.textContent.toLowerCase().includes(q))s=false;tr.style.display=s?'':'none'})})}
document.querySelector('.search-box')?.addEventListener('input',applyFilters);

function sortTable(tid,col,type){var t=document.getElementById(tid);if(!t)return;var b=t.querySelector('tbody');if(!b)return;var rows=Array.from(b.querySelectorAll('tr'));var isN=type==='num';var th=t.querySelectorAll('thead tr th')[col];var sa=th.classList.contains('sorted-asc');t.querySelectorAll('th').forEach(function(h){h.classList.remove('sorted-asc','sorted-desc')});th.classList.add(sa?'sorted-desc':'sorted-asc');rows.sort(function(a,b){var va=(a.cells[col]||{}).textContent||'';var vb=(b.cells[col]||{}).textContent||'';if(isN){va=parseFloat(va.replace(/[^0-9.-]/g,''))||0;vb=parseFloat(vb.replace(/[^0-9.-]/g,''))||0}return sa?(va>vb?-1:va<vb?1:0):(va<vb?-1:va>vb?1:0)});rows.forEach(function(r){b.appendChild(r)})}

function exportData(){var b=new Blob([JSON.stringify({s:DATA.s,n:DATA.n,ts:new Date().toISOString()},null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download={{EXPORT_NAME_JSON}};a.click()}
function importData(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){try{var d=JSON.parse(e.target.result);if(d.s)Object.assign(DATA.s,d.s);if(d.n)Object.assign(DATA.n,d.n);persistData();location.reload()}catch(err){alert('导入失败:'+err.message)}};r.readAsText(f)}
function clearData(){if(!confirm('确定清空所有星标和笔记？'))return;DATA={s:{},n:{}};persistData();location.reload()}

var _s=document.createElement('style');_s.textContent='tr.sr{background:#fffbe6!important}';document.head.appendChild(_s);
document.addEventListener('click',function(e){var star=e.target.closest('.star-btn');if(star){e.preventDefault();e.stopPropagation();toggleStar(star.getAttribute('data-nid'));return}var note=e.target.closest('.note-icon');if(note){e.stopPropagation();var nid=note.getAttribute('data-nid');var tr=note.closest('tr');var nm=tr?tr.querySelector('td:nth-child(3)').textContent.replace('📝','').trim():'';openNote(nid,nm,nm)}});
</script>
</body>
</html>

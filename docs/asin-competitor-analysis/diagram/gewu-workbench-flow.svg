<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 1040"><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b"/></pattern><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif}.t{font-size:23px;font-weight:bold;fill:#f8fafc}.h{font-size:14px;font-weight:600;fill:#fff}.s{font-size:11px;fill:#cbd5e1}.p{font-size:13px;font-weight:bold;fill:#fbbf24}</style></defs><rect width="1380" height="1040" fill="#0f172a"/><rect width="1380" height="1040" fill="url(#g)"/><text x="50" y="55" class="t">形态 C · 格物工作台模块</text><text x="50" y="82" class="s">异步任务与项目资料沉淀 · 遵循 DEV / TEST / PROD 与真实调用边界</text>
<rect x="40" y="125" width="300" height="820" rx="14" fill="none" stroke="#60a5fa" stroke-dasharray="7 5"/><text x="60" y="155" class="p">前端与用户审阅</text><rect x="80" y="210" width="220" height="105" rx="8" fill="#172554" stroke="#60a5fa"/><text x="190" y="250" text-anchor="middle" class="h">ASIN 分析页</text><text x="190" y="277" text-anchor="middle" class="s">ASIN + 站点 + 范围</text><text x="190" y="298" text-anchor="middle" class="s">展示调用计划/估算</text><path d="M190 315V365" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="80" y="365" width="220" height="125" rx="8" fill="#083344" stroke="#22d3ee"/><text x="190" y="405" text-anchor="middle" class="h">任务进度/结果</text><text x="190" y="432" text-anchor="middle" class="s">证据卡 · 冲突 · 覆盖度</text><text x="190" y="453" text-anchor="middle" class="s">评论主题与代表原文</text><text x="190" y="474" text-anchor="middle" class="s">人工复核/下载报告</text>
<rect x="380" y="125" width="650" height="820" rx="14" fill="none" stroke="#22d3ee" stroke-dasharray="7 5"/><text x="400" y="155" class="p">格物后端任务边界</text><path d="M300 260H420" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="420" y="205" width="560" height="90" rx="8" fill="#083344" stroke="#22d3ee"/><text x="700" y="240" text-anchor="middle" class="h">创建任务并冻结运行配置</text><text x="700" y="267" text-anchor="middle" class="s">站点/ASIN/工具计划/Skill+Prompt/模型凭据身份/Schema 版本</text><path d="M700 295V345" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="420" y="345" width="560" height="95" rx="8" fill="#064e3b" stroke="#34d399"/><text x="700" y="380" text-anchor="middle" class="h">异步编排器</text><text x="700" y="407" text-anchor="middle" class="s">进度事件 · 有界重试 · 取消/恢复 · 用量账本</text><text x="700" y="428" text-anchor="middle" class="s">每个成功阶段独立落盘，不被后续失败清空</text><path d="M700 440V480M700 480H555V510M700 480H845V510" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="430" y="510" width="250" height="100" rx="8" fill="#064e3b" stroke="#34d399"/><text x="555" y="548" text-anchor="middle" class="h">Sorftime MCP Adapter</text><text x="555" y="575" text-anchor="middle" class="s">namespace/schema 核对</text><text x="555" y="596" text-anchor="middle" class="s">站点 GB 显式映射</text><rect x="720" y="510" width="250" height="100" rx="8" fill="#083344" stroke="#22d3ee"/><text x="845" y="548" text-anchor="middle" class="h">SellerSprite MCP Adapter</text><text x="845" y="575" text-anchor="middle" class="s">MCP 客户端/凭据服务</text><text x="845" y="596" text-anchor="middle" class="s">站点 UK 按 schema 传值</text><path d="M555 610V655H700M845 610V655H700V690" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="420" y="690" width="560" height="100" rx="8" fill="#312e81" stroke="#a78bfa"/><text x="700" y="730" text-anchor="middle" class="h">分析内核 + Evidence Store</text><text x="700" y="757" text-anchor="middle" class="s">规范化字段 · 原始响应引用/哈希 · JSON Schema 校验</text><text x="700" y="778" text-anchor="middle" class="s">模型只接收必要字段；结论引用 evidence_id</text><path d="M700 790V835" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="420" y="835" width="560" height="75" rx="8" fill="#312e81" stroke="#a78bfa"/><text x="700" y="867" text-anchor="middle" class="h">报告/任务登记 → 项目文件库</text><text x="700" y="892" text-anchor="middle" class="s">JSON + HTML + 证据摘要；凭据不进入业务记录</text>
<rect x="1070" y="125" width="270" height="820" rx="14" fill="none" stroke="#fb7185" stroke-dasharray="7 5"/><text x="1090" y="155" class="p">运行治理</text><rect x="1105" y="210" width="200" height="130" rx="8" fill="#3f1728" stroke="#fb7185"/><text x="1205" y="250" text-anchor="middle" class="h">MCP / 模型</text><text x="1205" y="277" text-anchor="middle" class="s">可能收费</text><text x="1205" y="298" text-anchor="middle" class="s">请求次数不等于固定成本</text><text x="1205" y="320" text-anchor="middle" class="s">Key 不读取/不回显</text><rect x="1105" y="390" width="200" height="130" rx="8" fill="#302510" stroke="#fbbf24"/><text x="1205" y="430" text-anchor="middle" class="h">DEV 隔离验证</text><text x="1205" y="457" text-anchor="middle" class="s">合成数据回归</text><text x="1205" y="478" text-anchor="middle" class="s">真实样例须小范围、留证</text><text x="1205" y="500" text-anchor="middle" class="s">核实 Run Center 身份</text><rect x="1105" y="570" width="200" height="130" rx="8" fill="#302510" stroke="#fbbf24"/><text x="1205" y="610" text-anchor="middle" class="h">TEST 冻结构建</text><text x="1205" y="637" text-anchor="middle" class="s">不热更新</text><text x="1205" y="658" text-anchor="middle" class="s">只用隔离测试数据</text><text x="1205" y="680" text-anchor="middle" class="s">人工验收再推进</text><rect x="1105" y="750" width="200" height="130" rx="8" fill="#3f1728" stroke="#fb7185"/><text x="1205" y="790" text-anchor="middle" class="h">PROD 禁止测试</text><text x="1205" y="817" text-anchor="middle" class="s">不得用真实数据演练</text><text x="1205" y="838" text-anchor="middle" class="s">不得用版本号猜运行身份</text><text x="1205" y="860" text-anchor="middle" class="s">发布与验收分别记录</text><text x="50" y="990" class="s">实施顺序：盘点现有网关/任务/文件库 → 定 API/DB → UI 与进度 → 后端编排 → 假 provider 回归 → 隔离 DEV 受控联调 → TEST 冻结验收</text></svg>

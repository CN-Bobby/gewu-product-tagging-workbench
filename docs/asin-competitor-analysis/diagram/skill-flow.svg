<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1040"><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b"/></pattern><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif}.t{font-size:23px;font-weight:bold;fill:#f8fafc}.h{font-size:15px;font-weight:600;fill:#fff}.s{font-size:12px;fill:#cbd5e1}.p{font-size:13px;font-weight:bold;fill:#fbbf24}</style></defs><rect width="1160" height="1040" fill="#0f172a"/><rect width="1160" height="1040" fill="url(#g)"/><text x="50" y="55" class="t">形态 A · Codex Skill</text><text x="50" y="82" class="s">对话中的规程与 MCP 路由 · 不承担任务数据库或凭据保管</text>

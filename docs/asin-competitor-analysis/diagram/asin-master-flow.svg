<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1710">
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker><marker id="c" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#22d3ee"/></marker><style>text{font-family:'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif}.title{font-size:25px;font-weight:700;fill:#f8fafc}.sub{font-size:13px;fill:#94a3b8}.label{font-size:15px;font-weight:650;fill:#f8fafc}.small{font-size:12px;fill:#cbd5e1}.tiny{font-size:11px;fill:#94a3b8}.phase{font-size:14px;font-weight:700;fill:#fbbf24}</style></defs>
<rect width="1480" height="1710" fill="#0f172a"/><rect width="1480" height="1710" fill="url(#grid)"/>
<text x="60" y="55" class="title">单 ASIN 竞品分析 · 统一流程</text><text x="60" y="82" class="sub">Sorftime + SellerSprite MCP · 单站点 · 目标 ASIN + 最多 3 个竞品 · 证据驱动输出</text>
<rect x="80" y="120" width="1320" height="150" rx="14" fill="none" stroke="#fbbf24" stroke-dasharray="8 5"/><text x="100" y="148" class="phase">01 输入与范围</text>
<rect x="590" y="165" width="300" height="70" rx="30" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="740" y="194" text-anchor="middle" class="label">输入 marketplace + ASIN</text><text x="740" y="216" text-anchor="middle" class="small">可选：用途 / 对手数 / 评论范围</text>
<path d="M740 235V300" stroke="#22d3ee" stroke-width="2" marker-end="url(#c)"/>
<polygon points="740,300 900,365 740,430 580,365" fill="#302510" stroke="#fbbf24" stroke-width="2"/><text x="740" y="360" text-anchor="middle" class="label">站点与 ASIN 有效？</text><text x="740" y="382" text-anchor="middle" class="small">确认父 / 子体与市场</text>
<path d="M900 365H1110" stroke="#fb7185" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="980" y="353" class="tiny" fill="#fb7185">否</text>
<rect x="1110" y="325" width="250" height="80" rx="8" fill="#3f1728" stroke="#fb7185"/><text x="1235" y="356" text-anchor="middle" class="label">暂停并要求修正</text><text x="1235" y="379" text-anchor="middle" class="small">不猜站点，不猜 ASIN</text>
<path d="M740 430V480" stroke="#22d3ee" stroke-width="2" marker-end="url(#c)"/><text x="755" y="460" class="tiny" fill="#34d399">是</text>
<rect x="80" y="480" width="1320" height="180" rx="14" fill="none" stroke="#22d3ee" stroke-dasharray="8 5"/><text x="100" y="508" class="phase">02 并行采集目标 ASIN</text>
<rect x="145" y="535" width="350" height="85" rx="8" fill="#083344" stroke="#22d3ee"/><text x="320" y="566" text-anchor="middle" class="label">SellerSprite</text><text x="320" y="590" text-anchor="middle" class="small">asin_detail · asin_sales_trend</text><text x="320" y="608" text-anchor="middle" class="tiny">traffic_keyword · review (按需)</text>
<rect x="565" y="535" width="350" height="85" rx="8" fill="#064e3b" stroke="#34d399"/><text x="740" y="566" text-anchor="middle" class="label">Sorftime</text><text x="740" y="590" text-anchor="middle" class="small">product_detail · product_trend</text><text x="740" y="608" text-anchor="middle" class="tiny">traffic_terms · reviews / customers_say</text>
<rect x="985" y="535" width="350" height="85" rx="8" fill="#312e81" stroke="#a78bfa"/><text x="1160" y="566" text-anchor="middle" class="label">记录调用证据</text><text x="1160" y="590" text-anchor="middle" class="small">时间 · 参数 · 状态 · 响应哈希</text><text x="1160" y="608" text-anchor="middle" class="tiny">失败只重试有界次数，保留已成功阶段</text>
<path d="M495 578H565M915 578H985" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M740 660V715" stroke="#22d3ee" stroke-width="2" marker-end="url(#c)"/>
<rect x="80" y="715" width="1320" height="170" rx="14" fill="none" stroke="#34d399" stroke-dasharray="8 5"/><text x="100" y="743" class="phase">03 找对手并扩展比较</text>
<rect x="165" y="770" width="400" height="80" rx="8" fill="#083344" stroke="#22d3ee"/><text x="365" y="802" text-anchor="middle" class="label">发现候选竞品</text><text x="365" y="826" text-anchor="middle" class="small">SellerSprite asin_competitor + Sorftime 核心词对手</text>
<path d="M565 810H650" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><polygon points="820,760 990,810 820,860 650,810" fill="#302510" stroke="#fbbf24" stroke-width="2"/><text x="820" y="806" text-anchor="middle" class="label">同用途 / 同价带 / 同站点？</text><text x="820" y="829" text-anchor="middle" class="small">排除仅仅“相似”但非直接对手</text>
<path d="M990 810H1090" stroke="#22d3ee" stroke-width="2" marker-end="url(#c)"/><text x="1025" y="798" class="tiny" fill="#34d399">是</text><rect x="1090" y="770" width="250" height="80" rx="8" fill="#064e3b" stroke="#34d399"/><text x="1215" y="802" text-anchor="middle" class="label">去重保留最多 3 个</text><text x="1215" y="826" text-anchor="middle" class="small">记录入选理由与来源</text>
<path d="M820 860V910" stroke="#22d3ee" stroke-width="2" marker-end="url(#c)"/>
<rect x="80" y="910" width="1320" height="270" rx="14" fill="none" stroke="#a78bfa" stroke-dasharray="8 5"/><text x="100" y="938" class="phase">04 按证据维度补全竞品与用户声音</text>
<rect x="130" y="970" width="360" height="82" rx="8" fill="#083344" stroke="#22d3ee"/><text x="310" y="1001" text-anchor="middle" class="label">关键词与流量</text><text x="310" y="1026" text-anchor="middle" class="small">自然 / 广告 / 推荐拆开；时期一致</text>
<rect x="560" y="970" width="360" height="82" rx="8" fill="#064e3b" stroke="#34d399"/><text x="740" y="1001" text-anchor="middle" class="label">销售与价格趋势</text><text x="740" y="1026" text-anchor="middle" class="small">预测值标估算，注明粒度/时间窗</text>
<rect x="990" y="970" width="360" height="82" rx="8" fill="#312e81" stroke="#a78bfa"/><text x="1170" y="1001" text-anchor="middle" class="label">评论主题与引用</text><text x="1170" y="1026" text-anchor="middle" class="small">重复痛点 / 亮点 + 样本量与原文</text>
<path d="M310 1052V1100H1170V1052M740 1052V1100" fill="none" stroke="#64748b" stroke-width="1.5"/><path d="M740 1100V1130" stroke="#22d3ee" stroke-width="2" marker-end="url(#c)"/>
<rect x="280" y="1130" width="920" height="36" rx="6" fill="#172554" stroke="#60a5fa"/><text x="740" y="1154" text-anchor="middle" class="small">跨工具字段对齐：ASIN + marketplace + field + period；冲突并列展示</text>
<path d="M740 1180V1230" stroke="#22d3ee" stroke-width="2" marker-end="url(#c)"/>
<rect x="80" y="1230" width="1320" height="180" rx="14" fill="none" stroke="#fbbf24" stroke-dasharray="8 5"/><text x="100" y="1258" class="phase">05 模型综合与证据门</text>
<rect x="200" y="1285" width="400" height="85" rx="8" fill="#312e81" stroke="#a78bfa"/><text x="400" y="1317" text-anchor="middle" class="label">形成洞察与建议</text><text x="400" y="1341" text-anchor="middle" class="small">每条 claim 引用 evidence_id</text><text x="400" y="1358" text-anchor="middle" class="tiny">事实 / 推断 / 未知分开</text>
<path d="M600 1328H670" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><polygon points="830,1275 990,1328 830,1381 670,1328" fill="#302510" stroke="#fbbf24" stroke-width="2"/><text x="830" y="1325" text-anchor="middle" class="label">Schema / 引用校验过？</text><text x="830" y="1347" text-anchor="middle" class="small">缺证据 → 标 unknown</text>
<path d="M990 1328H1060" stroke="#22d3ee" stroke-width="2" marker-end="url(#c)"/><rect x="1060" y="1285" width="280" height="85" rx="8" fill="#064e3b" stroke="#34d399"/><text x="1200" y="1317" text-anchor="middle" class="label">JSON + 可读报告</text><text x="1200" y="1341" text-anchor="middle" class="small">证据 · 冲突 · 覆盖 · 待核验</text><text x="1200" y="1358" text-anchor="middle" class="tiny">人工审阅后保存</text>
<path d="M830 1381V1460H540" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="840" y="1417" class="tiny" fill="#fb7185">否：补证据或标待验证</text>
<rect x="80" y="1460" width="1320" height="190" rx="14" fill="none" stroke="#22d3ee" stroke-dasharray="8 5"/><text x="100" y="1488" class="phase">06 人工复核与交付</text>
<rect x="230" y="1520" width="1020" height="85" rx="30" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="740" y="1553" text-anchor="middle" class="label">复核目标页、竞品、关键词与评论代表样本</text><text x="740" y="1578" text-anchor="middle" class="small">再决定是否用于 Listing、广告或选品动作；分析建议不自动执行</text>
<text x="60" y="1680" class="tiny">关键约束：预估销量 ≠ 实际销售；Sorftime GB 对应 SellerSprite UK；评论上限/窗口写入报告；调用账本不含密钥。</text>
</svg>

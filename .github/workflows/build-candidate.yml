name: Build Windows Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install development dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix frontend

      - name: Audit source and fetch pinned build inputs
        run: |
          python scripts/repository_audit.py
          python scripts/sync_version.py --check
          python scripts/fetch_build_inputs.py

      - name: Build candidate installer
        run: python scripts/build_windows.py --candidate

      - name: Upload candidate build
        uses: actions/upload-artifact@v4
        with:
          name: gewu-workbench-candidate-${{ github.sha }}
          path: releases/**
          if-no-files-found: error
          retention-days: 30
